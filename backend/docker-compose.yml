name: moji

services:
  backend:
    image: moji-backend:${IMAGE_TAG:-latest}
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      REDIS_KEY_PREFIX: "moji:prod:"
      CHECK_CONNECTIONS_ON_STARTUP: "true"
      RELOAD: "false"
    networks:
      app_net:
        aliases:
          - moji-backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app_net:
    external: true
