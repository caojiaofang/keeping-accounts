server {
    listen 80;
    listen [::]:80;
    server_name mjzs.zf-yun.cn;
    return 308 https://mjzs.zf-yun.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mjzs.zf-yun.cn;

    ssl_certificate /etc/nginx/cert/mjzs.zf-yun.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/mjzs.zf-yun.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:moji_SSL:1m;
    ssl_session_timeout 10m;

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;

    # 两类 API 均原样转发；小程序继续使用既有 /api/v1。
    location ~ ^/(prod-api|api/v1)(/|$)|^/(docs|redoc)(/|$)|^/openapi\.json$ {
        # 每次容器更新后重新解析服务地址，无需重启公共 Nginx。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $moji_backend http://moji-backend:8000;
        proxy_pass $moji_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # 覆盖智能识别的模型超时上限，避免代理先于后端中断响应。
        proxy_read_timeout 120s;
        # SSE 首包、统计卡和正文增量立即转发，心跳覆盖模型推理等待。
        proxy_buffering off;
    }

    # 根路径及前端路由交给独立的 Web 静态服务。
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $moji_admin http://moji-admin:80;
        proxy_pass $moji_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
