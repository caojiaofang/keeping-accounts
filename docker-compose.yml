name: moji

services:
  backend:
    extends:
      file: backend/docker-compose.yml
      service: backend
  admin:
    image: moji-admin:${ADMIN_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    build:
      context: ./admin
    restart: unless-stopped
    networks:
      app_net:
        aliases:
          - moji-admin
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=1m,mode=1777
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app_net:
    external: true
